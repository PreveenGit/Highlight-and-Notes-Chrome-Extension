<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Extension preview</title>
    <style>
      #site { position: fixed; top: 0; right: 0; height: 100vh; border: 0; border-left: 1px solid #ccc; }
    </style>
  </head>
  <body>
    <!-- Development only. Renders the popup or the library on the left, wired to
         test-page.html?stub on the right through test/chrome-stub.js:
           ?ui=popup   the toolbar popup (default)
           ?ui=panel   the library as it appears in the side panel
           ?ui=tab     the library as a full tab
           &seed       first add a few sample pages to storage
         Reload to re-open the UI. -->
    <iframe id="site" src="test-page.html?stub"></iframe>
    <script src="chrome-stub.js"></script>
    <script>
      (async () => {
        const params = new URLSearchParams(location.search);
        const ui = params.get('ui') || 'popup';
        const width = { popup: 340, panel: 380, tab: 820 }[ui] || 340;
        const frame = document.getElementById('site');
        frame.style.width = `calc(100vw - ${width + 1}px)`;
        window.__hlStubInTab = ui === 'tab';
        if (params.has('seed')) await seed();

        // Wait for the content script in the frame to start.
        await new Promise((resolve) => {
          const poll = () => (frame.contentWindow.HL && frame.contentWindow.HL.started ? resolve() : setTimeout(poll, 50));
          poll();
        });
        window.__hlTabSend = (msg) => frame.contentWindow.__hlSend(msg);

        const pageUrl = new URL(ui === 'popup' ? '../popup/popup.html' : '../library/library.html', location.href);
        // Cache-buster so edited files are always picked up.
        const fresh = (href) => {
          const url = new URL(href, pageUrl);
          url.searchParams.set('t', Date.now());
          return url.href;
        };
        const doc = new DOMParser().parseFromString(await (await fetch(fresh(pageUrl))).text(), 'text/html');
        for (const link of doc.querySelectorAll('link[rel=stylesheet]')) {
          const el = document.createElement('link');
          el.rel = 'stylesheet';
          el.href = fresh(link.getAttribute('href'));
          document.head.append(el);
        }
        const scripts = [...doc.querySelectorAll('script[src]')].map((s) => fresh(s.getAttribute('src')));
        doc.querySelectorAll('script').forEach((s) => s.remove());
        document.body.insertAdjacentHTML('afterbegin', doc.body.innerHTML);
        if (ui !== 'popup') document.body.style.width = `${width}px`;
        for (const src of scripts) {
          await new Promise((resolve) => {
            const s = document.createElement('script');
            s.src = src;
            s.onload = resolve;
            document.body.append(s);
          });
        }
      })();

      // Sample pages so search, sorting and the timeline have something to show.
      async function seed() {
        const day = 86400000;
        const now = Date.now();
        const h = (id, color, text, daysAgo) => ({
          id,
          color,
          text,
          quote: { exact: text, prefix: '', suffix: '' },
          position: { start: 0, end: text.length },
          createdAt: now - daysAgo * day
        });
        const pages = [
          {
            url: 'https://en.wikipedia.org/wiki/Red_fox',
            title: 'Red fox - Wikipedia',
            highlights: [
              h('seed-fox-1', 'yellow', 'The red fox is the largest of the true foxes.', 2),
              h('seed-fox-2', 'green', 'It has the widest geographical range of any member of the order Carnivora.', 2),
              h('seed-fox-3', 'pink', 'Red foxes are usually found in pairs or small groups.', 9)
            ]
          },
          {
            url: 'https://developer.chrome.com/docs/extensions/reference/api/sidePanel',
            title: 'chrome.sidePanel | API reference',
            highlights: [
              h('seed-sp-1', 'blue', 'Use the chrome.sidePanel API to host content in the browser side panel.', 0.2),
              h('seed-sp-2', 'yellow', 'The side panel stays open while navigating between tabs.', 0.1)
            ]
          },
          {
            url: 'https://example.com/notes/reading-list?utm_source=newsletter',
            title: 'My reading list',
            highlights: [h('seed-read-1', 'orange', 'Read more papers, fewer summaries of papers.', 40)]
          }
        ];
        const items = {};
        for (const page of pages) {
          const key = 'hl:' + page.url.replace(/\?utm_source=newsletter$/, '');
          const existing = await chrome.storage.local.get(key);
          if (!existing[key]) items[key] = page;
        }
        if (Object.keys(items).length) await chrome.storage.local.set(items);
      }
    </script>
  </body>
</html>
