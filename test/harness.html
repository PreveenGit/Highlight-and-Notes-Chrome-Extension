<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Test harness</title>
    <style>
      body { font: 14px/1.5 system-ui, sans-serif; margin: 24px; }
      .pass { color: #188038; }
      .fail { color: #d93025; }
      #fixture { position: absolute; left: -9999px; } /* rendered, so computed styles are real */
    </style>
  </head>
  <body>
    <h1 id="summary">Running…</h1>
    <ol id="results"></ol>
    <div id="fixture"></div>

    <script src="../shared/common.js"></script>
    <script src="../content/anchor.js"></script>
    <script src="../content/marker.js"></script>
    <script src="../library/data.js"></script>
    <script>
      const fixture = document.getElementById('fixture');
      const { anchor, marker } = HL;
      const results = [];

      function test(name, fn) {
        try {
          fn();
          results.push({ name, ok: true });
        } catch (err) {
          results.push({ name, ok: false, error: err.message });
        }
      }

      function eq(actual, expected, label = 'value') {
        if (actual !== expected) {
          throw new Error(`${label}: expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`);
        }
      }

      function setup(html) {
        fixture.innerHTML = html;
        return anchor.buildIndex(fixture);
      }

      // Range over the text `from`...`to` (inclusive), located through the text index.
      function rangeOver(from, to = from, nth = 0) {
        const index = anchor.buildIndex(fixture);
        let start = -1;
        for (let i = 0; i <= nth; i++) start = index.text.indexOf(from, start + 1);
        const end = index.text.indexOf(to, start) + to.length;
        return anchor.toRange(index, start, end);
      }

      const marksText = (id) => marker.getMarks(id).map((m) => m.textContent).join('');

      const CROSS = '<p>Hello <b>bold</b> and <a href="#">link</a> text.</p>\n<p>Second paragraph here.</p>';

      test('wraps a selection across bold, link and paragraph boundaries', () => {
        setup(CROSS);
        const marks = marker.wrapRange(rangeOver('lo', 'Sec'), 'a', 'yellow');
        eq(marksText('a'), 'lo bold and link text.Sec', 'marked text');
        eq(marks.length, 6, 'mark count');
        eq([...fixture.childNodes].some((n) => n.nodeName === 'MARK'), false, 'mark between paragraphs');
      });

      test('unwrap restores the original markup', () => {
        setup(CROSS);
        const before = fixture.innerHTML;
        marker.wrapRange(rangeOver('lo', 'Sec'), 'a', 'green');
        marker.unwrap('a');
        eq(fixture.innerHTML, before, 'markup');
      });

      test('recolor changes every mark of a highlight', () => {
        setup(CROSS);
        marker.wrapRange(rangeOver('bold', 'link'), 'a', 'yellow');
        marker.recolor('a', 'pink');
        eq(marker.getMarks('a').every((m) => m.dataset.hlColor === 'pink'), true, 'all pink');
      });

      test('anchor round-trips through save and restore', () => {
        const index = setup(CROSS);
        const saved = anchor.fromRange(index, rangeOver('lo', 'Sec'));
        eq(saved.quote.exact.replace(/\s+/g, ' '), 'lo bold and link text. Sec', 'exact');
        const at = anchor.locate(anchor.buildIndex(fixture), saved);
        eq(at.start, saved.position.start, 'start');
        const range = anchor.toRange(anchor.buildIndex(fixture), at.start, at.end);
        eq(range.toString(), saved.quote.exact, 'restored text');
      });

      test('trims whitespace around the selection', () => {
        const index = setup('<p>alpha beta gamma</p>');
        const saved = anchor.fromRange(index, anchor.toRange(index, 5, 11)); // " beta "
        eq(saved.quote.exact, 'beta', 'exact');
      });

      test('handles element boundaries (triple-click style range)', () => {
        const index = setup('<p id="p1">First line</p><p id="p2">Second line</p>');
        const range = document.createRange();
        range.setStart(document.getElementById('p1'), 0);
        range.setEnd(document.getElementById('p2'), 0);
        eq(anchor.fromRange(index, range).quote.exact, 'First line', 'exact');
      });

      test('finds the highlight after text is added before it', () => {
        const index = setup('<p>Intro.</p><p>The quick brown fox jumps over the lazy dog.</p>');
        const saved = anchor.fromRange(index, rangeOver('brown fox'));
        const added = 'A brand new paragraph pushes everything down.';
        fixture.insertAdjacentHTML('afterbegin', `<p>${added}</p>`);
        const after = anchor.buildIndex(fixture);
        const at = anchor.locate(after, saved);
        eq(after.text.slice(at.start, at.end), 'brown fox', 'found text');
        eq(at.start, saved.position.start + added.length, 'new start');
      });

      test('uses context, not the old position, to pick a repeated word', () => {
        const index = setup('<p>The cat sat on the mat. The dog sat on the log.</p>');
        const saved = anchor.fromRange(index, rangeOver('sat', 'sat', 1)); // the dog's "sat"
        setup('<p>The dog sat on the log. The cat sat on the mat.</p>'); // cat's "sat" now at the old offset
        const after = anchor.buildIndex(fixture);
        const at = anchor.locate(after, saved);
        eq(after.text.slice(at.start - 8, at.end), 'The dog sat', 'chosen occurrence');
      });

      test('gives up on a short quote whose context is gone', () => {
        const index = setup('<p>The cat sat on the mat. The dog sat on the log.</p>');
        const saved = anchor.fromRange(index, rangeOver('log'));
        setup('<p>Totally different words, and a log elsewhere entirely</p>');
        eq(anchor.locate(anchor.buildIndex(fixture), saved), null, 'locate result');
      });

      test('skips whitespace between list items', () => {
        setup('<ul>\n<li>One</li>\n<li>Two</li>\n</ul>');
        const marks = marker.wrapRange(rangeOver('One', 'Two'), 'a', 'blue');
        eq(marksText('a'), 'OneTwo', 'marked text');
        eq(marks.every((m) => m.parentElement.tagName === 'LI'), true, 'marks inside <li>');
      });

      test('keeps whitespace between inline elements', () => {
        setup('<p><b>foo</b> <i>bar</i></p>');
        marker.wrapRange(rangeOver('foo', 'bar'), 'a', 'yellow');
        eq(marksText('a'), 'foo bar', 'marked text');
      });

      test('never marks text inside a textarea', () => {
        setup('<p>Before</p><textarea>inside</textarea><p>After</p>');
        const range = document.createRange();
        range.setStart(fixture.querySelector('p').firstChild, 0);
        range.setEnd(fixture.querySelectorAll('p')[1].firstChild, 5);
        marker.wrapRange(range, 'a', 'yellow');
        eq(fixture.querySelector('textarea mark'), null, 'mark in textarea');
        eq(marksText('a'), 'BeforeAfter', 'marked text');
      });

      test('nested highlights unwrap cleanly in either order', () => {
        setup(CROSS);
        const before = fixture.innerHTML;
        marker.wrapRange(rangeOver('bold', 'link'), 'outer', 'yellow');
        marker.wrapRange(rangeOver('and'), 'inner', 'pink');
        eq(marksText('inner'), 'and', 'inner text');
        marker.unwrap('outer');
        eq(marksText('inner'), 'and', 'inner survives outer removal');
        marker.unwrap('inner');
        eq(fixture.innerHTML, before, 'markup');
      });

      test('setNote adds a tooltip to every mark and a badge to the last one', () => {
        const before = setup(CROSS).text;
        marker.wrapRange(rangeOver('lo', 'Sec'), 'a', 'yellow');
        const marks = marker.getMarks('a');
        marker.setNote('a', '  my note \n line two ');
        eq(marks.every((m) => m.title === 'my note \n line two'), true, 'title on every mark');
        eq(marks.filter((m) => m.classList.contains('hl-note-badge')).length, 1, 'one badge');
        eq(marks[marks.length - 1].classList.contains('hl-note-badge'), true, 'badge on last mark');
        eq(anchor.buildIndex(fixture).text, before, 'page text unchanged');
        marker.setNote('a', '   ');
        eq(marks.some((m) => m.hasAttribute('title') || m.classList.contains('hl-note-badge')), false, 'cleared');
      });

      test('setBookmark clears the fill and puts the ribbon on the first mark only', () => {
        const before = setup(CROSS).text;
        marker.wrapRange(rangeOver('lo', 'Sec'), 'b', 'yellow');
        marker.setBookmark('b');
        const marks = marker.getMarks('b');
        eq(marks.every((m) => m.classList.contains('hl-bookmark')), true, 'bookmark class on every mark');
        eq(marks.every((m) => m.style.getPropertyValue('background-color') === 'transparent'), true, 'no fill');
        eq(marks.filter((m) => m.classList.contains('hl-bookmark-start')).length, 1, 'one ribbon');
        eq(marks[0].classList.contains('hl-bookmark-start'), true, 'ribbon on first mark');
        eq(anchor.buildIndex(fixture).text, before, 'page text unchanged');
      });

      test('page text is unchanged by marks', () => {
        const before = setup(CROSS).text;
        marker.wrapRange(rangeOver('Hello', 'here'), 'a', 'yellow');
        eq(anchor.buildIndex(fixture).text, before, 'page text');
      });

      test('page key ignores #hash and utm_* parameters', () => {
        eq(HL.pageKey('https://example.com/a?utm_source=x&id=2#top'), 'hl:https://example.com/a?id=2', 'key');
        eq(HL.pageKey('https://example.com/a?utm_medium=y'), 'hl:https://example.com/a', 'key without query');
        eq(HL.pageKey('https://example.com/a?x'), HL.pageKey('https://example.com/a?x='), 'equivalent queries');
      });

      // ---- Library data (library/data.js, shared/common.js) ----

      const DAY = 86400000;
      const hl = (id, color, text, createdAt, start = 0) => ({
        id,
        color,
        text,
        quote: { exact: text, prefix: '', suffix: '' },
        position: { start, end: start + text.length },
        createdAt
      });
      const STORAGE = {
        settings: { defaultColor: 'blue' },
        'hl:https://en.wikipedia.org/wiki/Fox': {
          url: 'https://en.wikipedia.org/wiki/Fox',
          title: 'Fox - Wikipedia',
          highlights: [hl('f2', 'green', 'Foxes live on every continent', 3 * DAY, 50), hl('f1', 'yellow', 'The quick brown fox', 1 * DAY, 10)]
        },
        'hl:https://www.example.com/dogs': {
          url: 'https://www.example.com/dogs',
          title: 'All about dogs',
          highlights: [hl('d1', 'pink', 'The lazy dog sleeps', 5 * DAY), hl('d2', 'yellow', 'Dogs and foxes are related', 6 * DAY, 20), hl('d3', 'blue', 'Bark', 7 * DAY, 40)]
        },
        'hl:https://empty.example/': { url: 'https://empty.example/', title: 'Empty', highlights: [] }
      };
      const ids = (list) => list.map((x) => x.id).join(',');

      test('toPages keeps only pages with highlights', () => {
        const pages = HL.data.toPages(STORAGE);
        eq(pages.length, 2, 'page count');
        const dogs = pages.find((p) => p.title === 'All about dogs');
        eq(dogs.site, 'example.com', 'site without www');
        eq(dogs.lastAt, 7 * DAY, 'lastAt');
        eq(dogs.firstAt, 5 * DAY, 'firstAt');
      });

      test('search needs every word, in the highlight text or page title/URL', () => {
        const pages = HL.data.toPages(STORAGE);
        eq(HL.data.filterAndSort(pages, { query: 'fox' }).count, 3, '"fox" matches');
        eq(ids(HL.data.filterAndSort(pages, { query: 'wikipedia quick' }).timeline.map((t) => t.highlight)), 'f1', 'title + text');
        eq(HL.data.filterAndSort(pages, { query: 'DOG Lazy' }).count, 1, 'case-insensitive AND');
        eq(HL.data.filterAndSort(pages, { query: 'zebra' }).count, 0, 'no match');
      });

      test('color filter keeps only the chosen colors', () => {
        const pages = HL.data.toPages(STORAGE);
        const result = HL.data.filterAndSort(pages, { colors: ['yellow', 'blue'] });
        eq(ids(result.timeline.map((t) => t.highlight)), 'd3,d2,f1', 'yellow and blue, newest first');
      });

      test('sorts pages and orders highlights within a page', () => {
        const pages = HL.data.toPages(STORAGE);
        const titles = (sort) => HL.data.filterAndSort(pages, { sort }).pages.map((p) => p.title).join(' | ');
        eq(titles('newest'), 'All about dogs | Fox - Wikipedia', 'newest (larger createdAt first)');
        eq(titles('oldest'), 'Fox - Wikipedia | All about dogs', 'oldest');
        eq(titles('site'), 'Fox - Wikipedia | All about dogs', 'site A-Z (en.wikipedia.org < example.com)');
        eq(titles('most'), 'All about dogs | Fox - Wikipedia', 'most highlights');
        const fox = HL.data.filterAndSort(pages, {}).pages.find((p) => p.title.startsWith('Fox'));
        eq(ids(fox.highlights), 'f1,f2', 'page order by position');
        eq(ids(HL.data.filterAndSort(pages, { sort: 'oldest' }).timeline.map((t) => t.highlight)), 'f1,f2,d1,d2,d3', 'timeline oldest');
      });

      test('Markdown export groups quotes under page links', () => {
        const md = HL.data.toMarkdown([
          { title: 'A [draft] page', url: 'https://x.test/a b', highlights: [{ text: 'one\n  two' }, { text: 'three' }] }
        ]);
        eq(md, '## [A \\[draft\\] page](https://x.test/a%20b)\n\n> one two\n\n> three\n', 'markdown');
      });

      test('Markdown export puts each note after its quote', () => {
        const md = HL.data.toMarkdown([
          { title: 'P', url: 'https://x.test/', highlights: [{ text: 'one', note: ' first line \nsecond ' }, { text: 'two', note: '  ' }] }
        ]);
        eq(md, '## [P](https://x.test/)\n\n> one\n\n**Note:** first line  \nsecond\n\n> two\n', 'markdown');
      });

      test('search also matches note text', () => {
        const pages = HL.data.toPages(STORAGE);
        pages[0].highlights = pages[0].highlights.map((h) => (h.id === 'f1' ? { ...h, note: 'Remember for the essay' } : h));
        eq(ids(HL.data.filterAndSort(pages, { query: 'essay' }).timeline.map((t) => t.highlight)), 'f1', 'note match');
        eq(ids(HL.data.filterAndSort(pages, { query: 'quick essay' }).timeline.map((t) => t.highlight)), 'f1', 'text + note');
      });

      test('bookmarks: left out by color filters, marked in Markdown', () => {
        const pages = HL.data.toPages(STORAGE);
        pages[0].highlights = [...pages[0].highlights, { ...hl('bm', 'yellow', 'Resume here', 4 * DAY, 90), bookmark: true }];
        eq(ids(HL.data.filterAndSort(pages, {}).timeline.map((t) => t.highlight)).includes('bm'), true, 'shown without a filter');
        eq(ids(HL.data.filterAndSort(pages, { colors: ['yellow'] }).timeline.map((t) => t.highlight)).includes('bm'), false, 'hidden by color filter');
        eq(ids(HL.data.filterAndSort(pages, { query: 'resume' }).timeline.map((t) => t.highlight)), 'bm', 'found by search');
        const md = HL.data.toMarkdown([{ title: 'P', url: 'https://x.test/', highlights: [{ text: 'Resume here', bookmark: true }] }]);
        eq(md, '## [P](https://x.test/)\n\n> 🔖 Resume here\n', 'markdown');
      });

      test('withNote sets, trims and removes a note', () => {
        const base = hl('a', 'pink', 'A', 1);
        eq(HL.withNote(base, '  hi  ').note, 'hi', 'trimmed');
        eq('note' in HL.withNote({ ...base, note: 'old' }, ' '), false, 'empty removes the field');
        eq('note' in HL.withNote(base, 42), false, 'non-string ignored');
      });

      test('backup round trip keeps every highlight', () => {
        const pages = HL.data.toPages(STORAGE);
        const back = HL.data.parseBackup(JSON.stringify(HL.data.toBackup(pages)));
        eq(back.length, 2, 'pages');
        eq(back.map((p) => p.key).sort().join(' '), pages.map((p) => p.key).sort().join(' '), 'keys');
        eq(ids(back.flatMap((p) => p.highlights)), ids(pages.flatMap((p) => p.highlights)), 'highlight ids');
      });

      test('backup import rejects bad files and cleans bad entries', () => {
        const fails = (text) => {
          try {
            HL.data.parseBackup(text);
            return false;
          } catch {
            return true;
          }
        };
        eq(fails('not json'), true, 'invalid JSON');
        eq(fails('{"pages": []}'), true, 'missing format tag');
        eq(fails('{"format": "highlight-backup", "version": 99, "pages": []}'), true, 'newer version');
        const pages = HL.data.parseBackup(
          JSON.stringify({
            format: 'highlight-backup',
            version: 1,
            pages: [
              { url: 'https://a.test/?utm_source=x', title: 'A', highlights: [{ id: 'ok', color: 'purple', quote: { exact: 'hi' } }, { id: 'bad' }] },
              { url: 'not a url', highlights: [{ id: 'x', quote: { exact: 'x' } }] }
            ]
          })
        );
        eq(pages.length, 1, 'pages kept');
        eq(pages[0].key, 'hl:https://a.test/', 'key recomputed');
        eq(ids(pages[0].highlights), 'ok', 'valid highlights');
        eq(pages[0].highlights[0].color, 'yellow', 'unknown color');
        eq(pages[0].highlights[0].text, 'hi', 'text falls back to quote');
      });

      test('backup keeps string notes and drops bad ones', () => {
        const pages = HL.data.parseBackup(
          JSON.stringify({
            format: 'highlight-backup',
            version: 1,
            pages: [
              {
                url: 'https://a.test/',
                highlights: [
                  { id: 'n1', quote: { exact: 'a' }, note: ' keep me ' },
                  { id: 'n2', quote: { exact: 'b' }, note: { evil: true } },
                  { id: 'n3', quote: { exact: 'c' }, note: '   ' }
                ]
              }
            ]
          })
        );
        const [n1, n2, n3] = pages[0].highlights;
        eq(n1.note, 'keep me', 'string note kept, trimmed');
        eq('note' in n2, false, 'object note dropped');
        eq('note' in n3, false, 'blank note dropped');
        const round = HL.data.parseBackup(JSON.stringify(HL.data.toBackup(pages)));
        eq(round[0].highlights[0].note, 'keep me', 'round trip');
      });

      test('backup keeps bookmarks and ignores bad bookmark values', () => {
        const pages = HL.data.parseBackup(
          JSON.stringify({
            format: 'highlight-backup',
            version: 1,
            pages: [
              {
                url: 'https://a.test/',
                highlights: [
                  { id: 'b1', quote: { exact: 'a' }, bookmark: true },
                  { id: 'b2', quote: { exact: 'b' }, bookmark: 'yes' }
                ]
              }
            ]
          })
        );
        const [b1, b2] = pages[0].highlights;
        eq(b1.bookmark, true, 'bookmark kept');
        eq('bookmark' in b2, false, 'non-boolean dropped');
      });

      test('merging keeps existing highlights and skips duplicates', () => {
        const existing = [hl('a', 'pink', 'A', 1), hl('b', 'blue', 'B', 2)];
        const incoming = [hl('b', 'yellow', 'B', 2), hl('c', 'green', 'C', 3), hl('c', 'green', 'C', 3)];
        const result = HL.data.mergeHighlights(existing, incoming);
        eq(ids(result.list), 'a,b,c', 'merged ids');
        eq(result.list[1].color, 'blue', 'existing entry wins');
        eq(result.added, 1, 'added');
        eq(result.skipped, 2, 'skipped');
      });

      test('diffHighlights finds added, removed and recolored', () => {
        const before = [hl('a', 'pink', 'A', 1), hl('b', 'blue', 'B', 2), hl('c', 'green', 'C', 3)];
        const after = [hl('a', 'pink', 'A', 1), hl('b', 'orange', 'B', 2), hl('d', 'yellow', 'D', 4)];
        const diff = HL.diffHighlights(before, after);
        eq(ids(diff.added), 'd', 'added');
        eq(ids(diff.removed), 'c', 'removed');
        eq(ids(diff.recolored), 'b', 'recolored');
        eq(ids(diff.noted), '', 'no note changes');
      });

      test('diffHighlights finds note changes', () => {
        const before = [hl('a', 'pink', 'A', 1), { ...hl('b', 'blue', 'B', 2), note: 'old' }, { ...hl('c', 'green', 'C', 3), note: 'same' }];
        const after = [{ ...hl('a', 'pink', 'A', 1), note: 'new' }, hl('b', 'blue', 'B', 2), { ...hl('c', 'green', 'C', 3), note: 'same ' }];
        eq(ids(HL.diffHighlights(before, after).noted), 'a,b', 'added and removed notes; whitespace-only change ignored');
      });

      const failed = results.filter((r) => !r.ok);
      const summary = failed.length ? `FAIL ${failed.length}/${results.length}` : `PASS ${results.length}/${results.length}`;
      document.title = summary;
      document.getElementById('summary').textContent = summary;
      document.getElementById('results').replaceChildren(
        ...results.map((r) => {
          const li = document.createElement('li');
          li.className = r.ok ? 'pass' : 'fail';
          li.textContent = r.ok ? r.name : `${r.name} — ${r.error}`;
          return li;
        })
      );
      window.harnessResults = results;
    </script>
  </body>
</html>
