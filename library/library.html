<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Highlight library</title>
    <link rel="stylesheet" href="../shared/theme.css" />
    <link rel="stylesheet" href="library.css" />
  </head>
  <body>
    <header class="top">
      <div class="title-row">
        <img class="logo" src="../icons/icon32.png" alt="" width="30" height="30" />
        <div class="brand">
          <h1>Highlights</h1>
          <span id="summary" class="muted"></span>
        </div>
        <button id="openTab" type="button" class="icon-btn" title="Open in a tab" aria-label="Open in a tab" hidden>
          <svg viewBox="0 0 24 24"><path d="M19 19H5V5h7V3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z" /></svg>
        </button>
        <div class="menu">
          <button id="menuButton" type="button" class="icon-btn" title="Export and import" aria-label="Export and import" aria-haspopup="menu" aria-expanded="false">
            <svg viewBox="0 0 24 24"><path d="M12 8a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm0 2a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm0 6a2 2 0 1 0 0 4 2 2 0 0 0 0-4z" /></svg>
          </button>
          <div id="menu" class="menu-list" role="menu" hidden>
            <button type="button" role="menuitem" data-command="export-md">Export Markdown</button>
            <button type="button" role="menuitem" data-command="export-json">Export backup (JSON)</button>
            <button type="button" role="menuitem" data-command="import">Import backup…</button>
            <hr class="menu-sep" />
            <button type="button" role="menuitem" data-command="guide">How Highlight works</button>
          </div>
        </div>
      </div>

      <div class="views" role="tablist" aria-label="View">
        <button id="viewPage" type="button" role="tab" data-view="page">This page</button>
        <button type="button" role="tab" data-view="pages">All pages</button>
        <button type="button" role="tab" data-view="timeline">Timeline</button>
        <button type="button" role="tab" data-view="learn">To learn</button>
      </div>

      <div class="filters">
        <div class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" /></svg>
          <input id="search" type="search" placeholder="Search text, notes, titles and sites" aria-label="Search highlights" />
        </div>
        <div class="filter-row">
          <div id="colors" class="chips" role="group" aria-label="Filter by color"></div>
          <select id="sort" aria-label="Sort">
            <option value="newest">Newest</option>
            <option value="oldest">Oldest</option>
            <option value="site">Site A–Z</option>
            <option value="most">Most highlights</option>
          </select>
        </div>
      </div>
    </header>

    <main id="content" aria-live="polite"></main>

    <div id="toast" class="toast" role="status" hidden>
      <span id="toastText"></span>
      <button id="toastUndo" type="button">Undo</button>
    </div>
    <input id="importFile" type="file" accept=".json,application/json" hidden />

    <script src="../shared/common.js"></script>
    <script src="data.js"></script>
    <script src="library.js"></script>
  </body>
</html>
