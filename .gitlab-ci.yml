# Publishes docs/ (the privacy policy) with GitLab Pages on every push to the
# default branch. Only this folder becomes public; the repository can stay private
# (set Settings > General > Visibility > Pages to "Everyone").
pages:
  stage: deploy
  image: alpine:3.20
  script:
    - mkdir -p public
    - cp -r docs/. public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
